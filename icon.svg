<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f1a"/>
      <stop offset="100%" stop-color="#131629"/>
    </linearGradient>
    <linearGradient id="hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b44fff"/>
      <stop offset="100%" stop-color="#ff3fa4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="18" fill="url(#bg)"/>

  <!-- Hexagon -->
  <polygon
    points="64,10 101,32 101,76 64,98 27,76 27,32"
    fill="none"
    stroke="url(#hex)"
    stroke-width="4"
    filter="url(#glow)"
  />

  <!-- Hexagon inner fill (subtle) -->
  <polygon
    points="64,14 97,33 97,75 64,94 31,75 31,33"
    fill="#1a1040"
    opacity="0.6"
  />

  <!-- >_ prompt -->
  <!-- > symbol -->
  <polyline
    points="34,56 46,64 34,72"
    fill="none"
    stroke="url(#hex)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <!-- _ cursor -->
  <line
    x1="52" y1="72"
    x2="68" y2="72"
    stroke="url(#hex)"
    stroke-width="4.5"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- "OB" text at bottom -->
  <text
    x="64" y="118"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="11"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    letter-spacing="2"
  >OPENBASE</text>
</svg>
